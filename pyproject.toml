[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "betel-pi"
version = "0.1.0"
description = "Betel Pi: Raspberry Pi-based audio-only recording device with VAD"
authors = [
    { name = "Betel Pi Team" }
]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "webrtcvad>=2.0.10",
]

[project.scripts]
betel-pi = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
